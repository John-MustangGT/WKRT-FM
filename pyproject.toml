[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "wkrt-fm"
dynamic = ["version"]
description = "WKRT-FM 104.7 — AI-powered retro 80s internet radio engine"
readme = "README.md"
requires-python = ">=3.11"
# System dependencies (not managed by uv/pip):
#   ffmpeg, ffprobe, ffplay  — audio processing and playback
#   piper / piper-tts        — local TTS binary (Piper backend)
#   icecast2                 — optional, for network streaming
# Target platforms: Raspberry Pi OS Bookworm, Debian/Ubuntu LXC containers.
dependencies = [
    "anthropic>=0.25.0",
    "mutagen>=1.47.0",
    "rich>=13.0.0",
    "httpx>=0.27.0",
    "google-cloud-texttospeech>=2.16.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
# pip install wkrt-fm[kokoro]  — on-device neural TTS (no cloud account needed)
kokoro = [
    "kokoro-onnx>=0.4.0",
    "soundfile>=0.12.0",
]

[project.scripts]
wkrt-fm = "wkrt.cli:main"

# ── Version from git tags ──────────────────────────────────────────────────
# Tag a release:  git tag v1.2.3 && git push --tags
# Between tags the version reads e.g. 1.2.3.dev4+gabcdef
[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
# Written at `uv build` time; committed copy lives in wkrt/_version.py
version-file = "wkrt/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["wkrt"]

# ── Dev dependencies ───────────────────────────────────────────────────────
[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

# ── Test config ────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
