[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "wkrt-fm"
version = "0.1.0"
description = "WKRT-FM 104.7 — AI-powered retro 80s internet radio engine"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.25.0",
    "mutagen>=1.47.0",
    "rich>=13.0.0",
    "httpx>=0.27.0",
    "google-cloud-texttospeech>=2.16.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
wkrt = "wkrt.engine:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["wkrt*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
